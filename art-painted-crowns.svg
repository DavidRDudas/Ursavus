    <radialGradient id="red-aura"><stop stop-color="#ff497e" stop-opacity=".22"/><stop offset="1" stop-color="#ff497e" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue-aura"><stop stop-color="#679bff" stop-opacity=".27"/><stop offset="1" stop-color="#679bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="room" x1="-72" y1="-32" x2="68" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#323148"/><stop offset="1" stop-color="#141728"/></linearGradient>
