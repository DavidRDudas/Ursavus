    <radialGradient id="violet-aura"><stop stop-color="#8b57ed" stop-opacity=".23"/><stop offset="1" stop-color="#8b57ed" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit" x1="122" y1="186" x2="662" y2="415" gradientUnits="userSpaceOnUse"><stop stop-color="#a480ff"/><stop offset=".35" stop-color="#64547d"/><stop offset=".65" stop-color="#ff7368"/><stop offset="1" stop-color="#ffc093"/></linearGradient>
