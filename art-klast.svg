<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <title>KLAST — precision in orbit</title>
  <desc>Original abstract artwork: a faceted starfighter accelerates across a luminous orbital arena surrounded by geometric asteroids, in coral and violet.</desc>
  <defs>
